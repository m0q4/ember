<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ember | Dashboard</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- LOGIN VIEW -->
  <section id="loginView" class="login-view">
    <div class="login-card">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>Ember</h1>
      </div>
      <p class="brand-tagline">Anticheat commerciale per server FiveM</p>
      <button id="discordLoginBtn" class="btn btn-discord">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M20.317 4.369A19.79 19.79 0 0 0 16.558 3c-.211.375-.444.884-.608 1.287a18.27 18.27 0 0 0-5.5 0A12.6 12.6 0 0 0 9.842 3a19.74 19.74 0 0 0-3.76 1.37C2.42 9.043 1.46 13.58 1.94 18.05a19.9 19.9 0 0 0 5.993 3.03c.483-.66.914-1.36 1.285-2.096a12.9 12.9 0 0 1-2.023-.976c.17-.124.336-.253.497-.386 3.902 1.804 8.13 1.804 11.985 0 .163.133.33.262.497.386-.646.386-1.323.71-2.026.978.372.735.803 1.435 1.286 2.095a19.84 19.84 0 0 0 6-3.03c.56-5.186-.94-9.68-3.121-13.681ZM8.68 15.331c-1.156 0-2.105-1.064-2.105-2.372 0-1.307.926-2.373 2.105-2.373 1.19 0 2.126 1.076 2.105 2.373 0 1.308-.926 2.372-2.105 2.372Zm6.646 0c-1.156 0-2.105-1.064-2.105-2.372 0-1.307.927-2.373 2.105-2.373 1.19 0 2.126 1.076 2.105 2.373 0 1.308-.916 2.372-2.105 2.372Z"/>
        </svg>
        Accedi con Discord
      </button>
      <p id="loginError" class="login-error hidden"></p>
    </div>
  </section>

  <!-- APP VIEW -->
  <div id="appView" class="app-view hidden">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>Ember</h1>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="overview">Overview</button>
        <button class="nav-item" data-view="online">Player online</button>
        <button class="nav-item" data-view="bans">Ban</button>
      </nav>
      <div class="sidebar-footer">
        <div class="admin-chip">
          <span id="adminName">-</span>
        </div>
        <button id="logoutBtn" class="btn btn-ghost btn-block">Esci</button>
      </div>
    </aside>

    <main class="content">
      <!-- OVERVIEW -->
      <section id="view-overview" class="view">
        <h2>Overview</h2>
        <div class="stat-grid">
          <div class="stat-card">
            <span class="stat-label">Ban totali</span>
            <span id="statTotalBans" class="stat-value">-</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Server collegati</span>
            <span id="statServers" class="stat-value">-</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Ban oggi</span>
            <span id="statBansToday" class="stat-value">-</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Player online</span>
            <span id="statOnline" class="stat-value">-</span>
          </div>
        </div>
      </section>

      <!-- PLAYER ONLINE -->
      <section id="view-online" class="view hidden">
        <div class="view-header">
          <h2>Player online</h2>
          <button id="refreshOnlineBtn" class="btn btn-ghost">Aggiorna</button>
        </div>
        <div class="card">
          <table class="table">
            <thead>
              <tr><th>Nome Steam</th><th>Identifier</th><th>Server</th><th></th></tr>
            </thead>
            <tbody id="onlineTableBody"></tbody>
          </table>
          <p id="onlineEmpty" class="empty-state hidden">Nessun player online al momento.</p>
        </div>
      </section>

      <!-- BAN -->
      <section id="view-bans" class="view hidden">
        <div class="view-header">
          <h2>Ban attivi</h2>
          <button id="refreshBansBtn" class="btn btn-ghost">Aggiorna</button>
        </div>
        <div id="bansList" class="bans-list"></div>
        <p id="bansEmpty" class="empty-state hidden">Nessun ban attivo.</p>
      </section>
    </main>
  </div>

  <!-- BAN CONFIRM MODAL -->
  <div id="banModal" class="modal hidden">
    <div class="modal-box">
      <h2>Conferma Ban</h2>
      <p id="banModalPlayer" class="modal-player"></p>
      <label for="banModalReason">Motivo del ban</label>
      <textarea id="banModalReason" placeholder="Es. Aimbot rilevato, cheat engine..."></textarea>
      <div class="modal-actions">
        <button id="banModalCancel" class="btn btn-ghost">Annulla</button>
        <button id="banModalConfirm" class="btn btn-danger">Conferma Ban</button>
      </div>
    </div>
  </div>

  <!-- REPLAY MODAL -->
  <div id="replayModal" class="modal hidden">
    <div class="modal-box modal-box-lg">
      <div class="replay-header">
        <h2>Replay ban</h2>
        <button id="replayClose" class="btn btn-ghost">&times;</button>
      </div>
      <canvas id="replayCanvas" width="640" height="420"></canvas>
      <div class="replay-controls">
        <button id="replayPlay" class="btn btn-accent">Play</button>
        <input id="replaySlider" type="range" min="0" max="0" value="0" />
        <span id="replayFrameLabel" class="replay-frame-label">0 / 0</span>
      </div>
      <div id="replayInfo" class="replay-info"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
